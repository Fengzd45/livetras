<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>四人会谈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #12122a;
            border-radius: 14px;
            border: 1px solid #2a2a4a;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header h1 { font-size: 20px; color: #7c9bff; letter-spacing: 1px; }
        .header .status { font-size: 14px; color: #aaa; }
        .header .status .count { color: #6fcf97; font-weight: 600; }
        .header .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .header .controls input {
            background: #1e1e3a;
            color: #fff;
            border: 1px solid #333;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 14px;
            width: 130px;
            outline: none;
        }
        .header .controls input:focus { border-color: #4a6cf7; }
        .header .controls select {
            background: #1e1e3a;
            color: #fff;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .header .controls button {
            background: #4a6cf7;
            border: none;
            color: #fff;
            padding: 5px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .header .controls button:hover { background: #5a7cf7; }
        .header .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        .header .controls .badge {
            font-size: 12px;
            padding: 3px 12px;
            border-radius: 20px;
            background: #1a1a35;
            color: #666;
        }
        .header .controls .badge.online { background: #1a3a2a; color: #6fcf97; }
        .header .controls .badge.offline { background: #3a1a1a; color: #f26a6a; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background: #12122a;
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #222244;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.3s;
        }
        .card.active { border-color: #4a6cf7; }
        .card.speaking { border-color: #f2a86a; box-shadow: 0 0 20px rgba(242, 168, 106, 0.08); }
        .card .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .card .row .name {
            font-size: 16px;
            font-weight: 600;
            color: #c0d0ff;
            min-width: 60px;
        }
        .card .row .wave {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            height: 20px;
            min-width: 40px;
            background: #08081a;
            border-radius: 4px;
            padding: 0 4px;
        }
        .card .row .wave .bar {
            display: inline-block;
            flex: 1;
            height: 4px;
            background: #2a2a4a;
            border-radius: 2px;
            transition: height 0.08s ease;
        }
        .card .row .wave .bar.active { background: #6fcf97; height: 8px; }
        .card .row .wave .bar.loud { background: #f2a86a; height: 16px; }
        .card .row .state {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            background: #1a1a35;
            color: #666;
            white-space: nowrap;
            min-width: 48px;
            text-align: center;
        }
        .card .row .state.online { background: #1a3a2a; color: #6fcf97; }
        .card .row .state.speaking { background: #3a2a1a; color: #f2a86a; animation: pulse 0.8s infinite; }
        .card .row .state.waiting { background: #1a1a35; color: #666; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
        .card .scroll {
            flex: 1;
            overflow-y: auto;
            max-height: 70px;
            font-size: 14px;
            line-height: 1.5;
            background: #08081a;
            border-radius: 6px;
            padding: 4px 8px;
            min-height: 32px;
            margin-top: 2px;
        }
        .card .scroll::-webkit-scrollbar { width: 3px; }
        .card .scroll::-webkit-scrollbar-thumb { background: #4a6cf7; border-radius: 4px; }
        .card .scroll .msg {
            padding: 1px 4px;
            color: #e0e0e0;
            font-size: 13px;
            border-bottom: 1px solid #0e0e24;
        }
        .card .scroll .msg:last-child { border-bottom: none; }
        .card .scroll .empty { color: #444; font-style: italic; font-size: 12px; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a35;
            padding: 6px 18px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            z-index: 999;
            border: 1px solid #333;
            max-width: 90%;
        }
        .toast.show { display: block; }
        @media (max-width: 550px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <h1>🎙️ 四人会谈</h1>
    <span class="status">👤 <span class="count" id="onlineCount">0</span>/4</span>
    <div class="controls">
        <input type="text" id="myName" placeholder="输入你的姓名" value="冯忠德">
        <select id="regionSelect">
            <option value="cn">国内</option>
            <option value="intl">国际</option>
        </select>
        <span class="badge offline" id="connBadge">● 离线</span>
        <button id="actionBtn">加入</button>
        <button id="leaveBtn" disabled>离开</button>
    </div>
</div>

<div class="grid" id="cardGrid"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 配置
// ============================================================
const ROOM_ID = 'room1';
const CARD_IDS = ['user1', 'user2', 'user3', 'user4'];

let clientId = null;
let ws = null;
let isConnected = false;
let audioCtx = null;
let mediaStream = null;
let sourceNode = null;
let processorNode = null;
let reconnectTimer = null;
let waveformAnimId = null;
let waveformData = {};
let speakingMap = {};
let myCardId = 'user1';
let audioSendCount = 0;

const cardGrid = document.getElementById('cardGrid');
const actionBtn = document.getElementById('actionBtn');
const leaveBtn = document.getElementById('leaveBtn');
const connBadge = document.getElementById('connBadge');
const onlineCount = document.getElementById('onlineCount');
const myNameInput = document.getElementById('myName');
const regionSelect = document.getElementById('regionSelect');
const toastEl = document.getElementById('toast');

// ============================================================
// 语言检测
// ============================================================
function detectLanguage(name) {
    if (/[\u4e00-\u9fff]/.test(name)) return 'zh';
    if (/[\u3040-\u30ff\u31f0-\u31ff]/.test(name)) return 'ja';
    if (/[\uac00-\ud7af\u1100-\u11ff]/.test(name)) return 'ko';
    if (/[\u0400-\u04ff]/.test(name)) return 'ru';
    return 'en';
}

// ============================================================
// 初始化卡片
// ============================================================
function initCards() {
    cardGrid.innerHTML = '';
    CARD_IDS.forEach(id => {
        waveformData[id] = new Array(20).fill(0);
        speakingMap[id] = false;
        const div = document.createElement('div');
        div.className = 'card';
        div.id = `card-${id}`;
        div.innerHTML = `
            <div class="row">
                <span class="name" id="name-${id}">${id}</span>
                <span class="wave" id="wave-${id}">
                    ${Array(20).fill(0).map((_, i) => `<span class="bar" id="bar-${id}-${i}"></span>`).join('')}
                </span>
                <span class="state waiting" id="state-${id}">⏳ 等待</span>
            </div>
            <div class="scroll" id="scroll-${id}">
                <div class="empty">等待加入...</div>
            </div>
        `;
        cardGrid.appendChild(div);
    });
}
initCards();

// ============================================================
// 工具函数
// ============================================================
function showToast(msg, dur = 3000) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), dur);
}

function updateCardState(id, text, cls) {
    const el = document.getElementById(`state-${id}`);
    if (el) { el.textContent = text; el.className = 'state ' + cls; }
}

function updateCardName(id, name) {
    const el = document.getElementById(`name-${id}`);
    if (el) el.textContent = name;
}

function setCardEmpty(id, empty) {
    const el = document.getElementById(`scroll-${id}`);
    if (!el) return;
    if (empty) {
        el.innerHTML = '<div class="empty">等待加入...</div>';
    }
}

function appendMessage(id, text) {
    const el = document.getElementById(`scroll-${id}`);
    if (!el) return;
    const empty = el.querySelector('.empty');
    if (empty) empty.remove();
    const d = document.createElement('div');
    d.className = 'msg';
    d.textContent = text;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    while (el.children.length > 20) el.removeChild(el.firstChild);
}

function updateConnBadge(online) {
    if (online) {
        connBadge.textContent = '● 在线';
        connBadge.className = 'badge online';
        actionBtn.disabled = true;
        leaveBtn.disabled = false;
    } else {
        connBadge.textContent = '● 离线';
        connBadge.className = 'badge offline';
        actionBtn.disabled = false;
        leaveBtn.disabled = true;
    }
}

function updateOnlineCount(count) {
    onlineCount.textContent = count;
}

// ============================================================
// 波形图
// ============================================================
function updateWaveform(id, amplitude) {
    const bars = document.querySelectorAll(`#wave-${id} .bar`);
    if (!bars.length) return;
    const h = Math.min(18, Math.max(4, 4 + amplitude * 45));
    for (let i = 0; i < bars.length; i++) {
        const factor = 0.5 + 0.5 * Math.sin(i * 1.3 + Date.now() / 250);
        const barH = Math.max(4, h * factor * 0.8 + 2);
        bars[i].style.height = barH + 'px';
        if (amplitude > 0.05) {
            bars[i].className = 'bar loud';
        } else if (amplitude > 0.01) {
            bars[i].className = 'bar active';
        } else {
            bars[i].className = 'bar';
        }
    }
    const isSpeaking = amplitude > 0.015;
    speakingMap[id] = isSpeaking;
    const stateEl = document.getElementById(`state-${id}`);
    const cardEl = document.getElementById(`card-${id}`);
    if (stateEl) {
        if (isSpeaking) {
            stateEl.textContent = '🔊 说话';
            stateEl.className = 'state speaking';
            if (cardEl) cardEl.className = 'card speaking';
        } else if (id === myCardId && isConnected) {
            stateEl.textContent = '🎤 在线';
            stateEl.className = 'state online';
            if (cardEl) cardEl.className = 'card active';
        } else {
            stateEl.textContent = '⏳ 等待';
            stateEl.className = 'state waiting';
            if (cardEl) cardEl.className = 'card';
        }
    }
}

function resetWaveform(id) {
    const bars = document.querySelectorAll(`#wave-${id} .bar`);
    bars.forEach(b => { b.style.height = '4px'; b.className = 'bar'; });
    speakingMap[id] = false;
    const stateEl = document.getElementById(`state-${id}`);
    const cardEl = document.getElementById(`card-${id}`);
    if (stateEl) {
        if (id === myCardId && isConnected) {
            stateEl.textContent = '🎤 在线';
            stateEl.className = 'state online';
            if (cardEl) cardEl.className = 'card active';
        } else {
            stateEl.textContent = '⏳ 等待';
            stateEl.className = 'state waiting';
            if (cardEl) cardEl.className = 'card';
        }
    }
}

function startWaveformLoop() {
    if (waveformAnimId) cancelAnimationFrame(waveformAnimId);
    function loop() {
        CARD_IDS.forEach(id => {
            const data = waveformData[id];
            if (data && data.some(v => v > 0.02)) {
                const avg = data.reduce((a,b) => a + b, 0) / data.length;
                updateWaveform(id, avg);
            } else if (speakingMap[id]) {
                updateWaveform(id, 0.01);
            } else {
                resetWaveform(id);
            }
        });
        waveformAnimId = requestAnimationFrame(loop);
    }
    loop();
}

function feedAudioData(id, floatData) {
    if (!floatData || floatData.length === 0) return;
    let sum = 0;
    const len = Math.min(floatData.length, 2048);
    for (let i = 0; i < len; i++) sum += floatData[i] * floatData[i];
    const rms = Math.sqrt(sum / len);
    if (!waveformData[id]) waveformData[id] = new Array(20).fill(0);
    const arr = waveformData[id];
    arr.push(rms);
    if (arr.length > 20) arr.shift();
}

// ============================================================
// 核心：根据后端返回的 clients 映射到卡片
// ============================================================
function redrawAllCards(clients) {
    CARD_IDS.forEach(id => {
        const card = document.getElementById(`card-${id}`);
        if (!card) return;
        const defaultName = id === 'user1' ? 'user1' : id;
        updateCardName(id, defaultName);
        updateCardState(id, '⏳ 空位', 'waiting');
        card.className = 'card';
        setCardEmpty(id, true);
        resetWaveform(id);
    });

    const onlineUsers = clients || [];
    onlineUsers.forEach((user, index) => {
        if (index >= CARD_IDS.length) return;
        const cardId = CARD_IDS[index];
        const userId = user.id || `user${index + 1}`;
        updateCardName(cardId, userId);
        updateCardState(cardId, '🎤 在线', 'online');
        document.getElementById(`card-${cardId}`).className = 'card active';
        setCardEmpty(cardId, false);
        if (userId === clientId) {
            myCardId = cardId;
        }
    });

    updateOnlineCount(onlineUsers.length);
}

// ============================================================
// WebSocket 连接
// ============================================================
function connect() {
    const name = myNameInput.value.trim() || '我';
    clientId = name;
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${protocol}//${window.location.host}/ws/${ROOM_ID}/${encodeURIComponent(clientId)}`;

    updateConnBadge(false);
    showToast('🔄 连接中...');

    ws = new WebSocket(url);
    ws.onopen = () => {
        console.log('✅ WebSocket 连接已打开');
        isConnected = true;
        updateConnBadge(true);
        showToast(`✅ ${clientId} 已加入`);

        const lang = detectLanguage(clientId);
        myCardId = 'user1';
        updateCardName('user1', clientId);
        updateCardState('user1', '🎤 在线', 'online');
        document.getElementById(`card-user1`).className = 'card active';
        setCardEmpty('user1', false);

        sendMsg({ type: 'set_region', region: regionSelect.value });
        sendMsg({ type: 'set_language', target_lang: lang });

        startAudioCapture();
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    ws.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            console.log('收到消息:', data);
            if (data.type === 'room_status') {
                const clients = data.clients || [];
                redrawAllCards(clients);
                const myFound = clients.find(c => c.id === clientId);
                if (myFound) {
                    const myIndex = clients.indexOf(myFound);
                    const myCard = CARD_IDS[myIndex] || 'user1';
                    myCardId = myCard;
                    updateCardName(myCard, myFound.id);
                    updateCardState(myCard, '🎤 在线', 'online');
                    document.getElementById(`card-${myCard}`).className = 'card active';
                    setCardEmpty(myCard, false);
                }
            } else if (data.type === 'translation') {
                const text = data.text || '';
                if (clientId && text) {
                    appendMessage(myCardId || 'user1', text);
                }
                if (data.audio) playAudio(data.audio);
            } else if (data.type === 'asr_result') {
                const text = data.text || '';
                if (text && myCardId) {
                    appendMessage(myCardId, '🎤 ' + text);
                }
            } else if (data.type === 'region_status') {
                showToast(`🌐 ${data.msg}`);
            }
        } catch (err) {
            console.error('解析消息失败:', err);
        }
    };

    ws.onclose = () => {
        console.log('❌ WebSocket 连接已关闭');
        isConnected = false;
        updateConnBadge(false);
        stopAudioCapture();
        updateCardState(myCardId || 'user1', '离线', 'waiting');
        document.getElementById(`card-${myCardId || 'user1'}`).className = 'card';
        resetWaveform(myCardId || 'user1');
        showToast('❌ 已断开');
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
            if (!isConnected) { showToast('🔄 重连...'); connect(); }
        }, 5000);
    };

    ws.onerror = () => {
        console.error('❌ WebSocket 错误');
        updateConnBadge(false);
        showToast('⚠️ 连接错误');
    };
}

function sendMsg(data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
    } else {
        console.warn('⚠️ WebSocket 未打开，无法发送消息:', data.type);
    }
}

// ============================================================
// 音频采集（修正版：强制 16000Hz + 音量检测）
// ============================================================
async function startAudioCapture() {
    try {
        console.log('🎤 开始初始化音频...');
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: 16000
        });
        console.log('✅ AudioContext 采样率:', audioCtx.sampleRate);
        
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
            audio: {
                sampleRate: 16000,
                channelCount: 1,
                echoCancellation: false,
                noiseSuppression: false
            }
        });
        console.log('✅ 麦克风已获取');
        sourceNode = audioCtx.createMediaStreamSource(mediaStream);

        processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
        processorNode.onaudioprocess = (ev) => {
            if (!isConnected) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const inputData = ev.inputBuffer.getChannelData(0);
            
            // 检测音量，静音时跳过
            let sum = 0;
            for (let i = 0; i < inputData.length; i++) {
                sum += inputData[i] * inputData[i];
            }
            const rms = Math.sqrt(sum / inputData.length);
            if (rms < 0.005) return; // 静音跳过
            
            feedAudioData(myCardId || 'user1', inputData);
            const pcm = floatTo16BitPCM(inputData);
            const b64 = arrayBufferToBase64(pcm);
            
            audioSendCount++;
            if (audioSendCount % 30 === 0) {
                console.log('🎤 发送音频，音量:', rms.toFixed(4));
            }
            sendMsg({ type: 'audio', audio: b64 });
        };

        sourceNode.connect(processorNode);
        processorNode.connect(audioCtx.destination);
        console.log('✅ 音频采集已启动 (16000Hz)');
    } catch (err) {
        showToast('⚠️ 麦克风被拒绝');
        console.error('❌ 音频初始化失败:', err);
        updateConnBadge(false);
    }
}

function stopAudioCapture() {
    if (processorNode) { processorNode.disconnect(); processorNode = null; }
    if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioCtx && audioCtx.state !== 'closed') { audioCtx.close(); audioCtx = null; }
    console.log('🛑 音频采集已停止');
}

// ============================================================
// 音频工具
// ============================================================
function floatTo16BitPCM(float32Array) {
    const pcm = new Int16Array(float32Array.length);
    for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        pcm[i] = Math.round(s * 32767);
    }
    return pcm.buffer;
}

function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

function playAudio(b64) {
    try {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = ctx.createBuffer(1, bytes.length / 2, 24000);
        const ch = buffer.getChannelData(0);
        for (let i = 0; i < ch.length; i++) {
            ch[i] = (bytes[i*2] + bytes[i*2+1]*256) / 32768;
        }
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        src.start();
        setTimeout(() => ctx.close(), 4000);
    } catch (e) { console.error('播放失败', e); }
}

// ============================================================
// 事件绑定
// ============================================================
actionBtn.addEventListener('click', connect);
myNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

leaveBtn.addEventListener('click', () => { if (ws) ws.close(); });

regionSelect.addEventListener('change', () => {
    if (isConnected) sendMsg({ type: 'set_region', region: regionSelect.value });
});

myNameInput.addEventListener('change', () => {
    if (isConnected) {
        const newName = myNameInput.value.trim() || '我';
        clientId = newName;
        const lang = detectLanguage(newName);
        if (myCardId) {
            updateCardName(myCardId, newName);
            sendMsg({ type: 'set_language', target_lang: lang });
            showToast(`🔄 语言: ${lang}`);
        }
    }
});

// ============================================================
// 启动
// ============================================================
startWaveformLoop();
console.log('🎙️ 四人会谈已加载 (最终版)');
</script>
</body>
</html>
