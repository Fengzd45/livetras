<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同声传译 - 4人会议</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #7c9bff; }
        .controls { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .controls label { display: flex; align-items: center; gap: 8px; font-size: 14px; background: #1a1a2e; padding: 8px 16px; border-radius: 8px; }
        .controls select { background: #2a2a4a; color: #fff; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; }
        .controls button { background: #4a6cf7; border: none; color: #fff; padding: 8px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .controls button:hover { background: #5a7cf7; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 900px; }
        .window { background: #1a1a2e; border-radius: 12px; padding: 16px; border: 1px solid #2a2a4a; min-height: 200px; display: flex; flex-direction: column; }
        .window .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: #aaa; border-bottom: 1px solid #2a2a4a; padding-bottom: 8px; }
        .window .header .status { font-size: 12px; padding: 2px 10px; border-radius: 12px; background: #2a2a4a; }
        .window .header .status.active { background: #4a6cf7; color: #fff; }
        .window .scroll { flex: 1; overflow-y: auto; max-height: 200px; font-size: 14px; line-height: 1.6; padding-right: 4px; }
        .window .scroll::-webkit-scrollbar { width: 4px; }
        .window .scroll::-webkit-scrollbar-thumb { background: #4a6cf7; border-radius: 2px; }
        .window .scroll .msg { margin-bottom: 4px; padding: 4px 8px; background: #0f0f1a; border-radius: 4px; }
        .window .scroll .msg .speaker { color: #7c9bff; font-weight: bold; }
        .window .scroll .msg .text { color: #ddd; }
        .window .scroll .msg .lang-tag { font-size: 11px; color: #888; margin-left: 8px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2a2a4a; padding: 12px 24px; border-radius: 8px; font-size: 14px; display: none; }
        .toast.show { display: block; }
    </style>
</head>
<body>

    <h1>🎙️ 同声传译 · 4人会议</h1>

    <div class="controls">
        <label>👤 我的名字:
            <input type="text" id="myName" value="我" style="background:#2a2a4a;color:#fff;border:1px solid #444;padding:4px 8px;border-radius:4px;width:80px;">
        </label>
        <label>🎯 我想听的语言:
            <select id="targetLang">
                <option value="en">英语</option>
                <option value="zh">中文</option>
                <option value="ja">日语</option>
                <option value="ko">韩语</option>
                <option value="fr">法语</option>
                <option value="de">德语</option>
                <option value="es">西班牙语</option>
                <option value="ru">俄语</option>
            </select>
        </label>
        <button id="joinBtn">加入会议</button>
        <button id="leaveBtn" disabled>离开会议</button>
    </div>

    <div class="grid" id="windowsGrid">
        <!-- 4个窗口由 JavaScript 动态生成 -->
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // --- 配置 ---
        const roomId = 'room1';
        let clientId = null;
        let ws = null;
        let isConnected = false;
        let isSpeaking = false;
        let audioContext = null;
        let mediaStream = null;
        let sourceNode = null;
        let workletNode = null;

        // 存储每个窗口的消息
        const windowMessages = {};

        // DOM 元素
        const windowsGrid = document.getElementById('windowsGrid');
        const joinBtn = document.getElementById('joinBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const myNameInput = document.getElementById('myName');
        const targetLangSelect = document.getElementById('targetLang');
        const toastEl = document.getElementById('toast');

        // --- 初始化界面: 4个窗口 ---
        function initWindows() {
            windowsGrid.innerHTML = '';
            for (let i = 1; i <= 4; i++) {
                const id = `user${i}`;
                windowMessages[id] = [];
                const div = document.createElement('div');
                div.className = 'window';
                div.id = `window-${id}`;
                div.innerHTML = `
                    <div class="header">
                        <span>👤 <span class="name">${id}</span></span>
                        <span class="status" id="status-${id}">等待中</span>
                    </div>
                    <div class="scroll" id="scroll-${id}"></div>
                `;
                windowsGrid.appendChild(div);
            }
        }
        initWindows();

        // --- Toast 提示 ---
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 3000);
        }

        // --- 在窗口中追加消息 ---
        function appendMessage(clientId, text, lang, speakerName) {
            const scrollEl = document.getElementById(`scroll-${clientId}`);
            if (!scrollEl) return;
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            const speaker = speakerName || clientId;
            msgDiv.innerHTML = `
                <span class="speaker">${speaker}:</span>
                <span class="text">${text}</span>
                <span class="lang-tag">[${lang}]</span>
            `;
            scrollEl.appendChild(msgDiv);
            scrollEl.scrollTop = scrollEl.scrollHeight;
        }

        // --- 更新窗口状态 ---
        function updateWindowStatus(clientId, status, name) {
            const statusEl = document.getElementById(`status-${clientId}`);
            const nameEl = document.querySelector(`#window-${clientId} .name`);
            if (statusEl) statusEl.textContent = status;
            if (nameEl && name) nameEl.textContent = name;
        }

        // --- WebSocket 连接 ---
        function connect() {
            const name = myNameInput.value.trim() || '我';
            clientId = name;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${roomId}/${encodeURIComponent(clientId)}`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                isConnected = true;
                joinBtn.disabled = true;
                leaveBtn.disabled = false;
                showToast('✅ 已加入会议');
                sendMessage({ type: 'set_language', target_lang: targetLangSelect.value });
                updateWindowStatus(clientId, '🎤 在线', clientId);
                startAudioCapture();
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            };

            ws.onclose = () => {
                isConnected = false;
                joinBtn.disabled = false;
                leaveBtn.disabled = true;
                showToast('❌ 已离开会议');
                stopAudioCapture();
                updateWindowStatus(clientId, '离线', clientId);
            };

            ws.onerror = (err) => {
                console.error('WebSocket 错误:', err);
                showToast('⚠️ 连接错误');
            };
        }

        function sendMessage(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        // --- 处理服务器消息 ---
        function handleMessage(data) {
            const type = data.type;

            if (type === 'room_status') {
                const clients = data.clients || [];
                const allIds = ['user1', 'user2', 'user3', 'user4'];
                const activeIds = clients.map(c => c.id);
                allIds.forEach(id => {
                    const client = clients.find(c => c.id === id);
                    if (client) {
                        updateWindowStatus(id, `🎤 ${client.lang || '未设置'}`, id);
                    } else {
                        updateWindowStatus(id, '空位', id);
                    }
                });
                if (clientId && !activeIds.includes(clientId)) {
                    sendMessage({ type: 'set_language', target_lang: targetLangSelect.value });
                }
            }

            if (type === 'translation') {
                const from = data.from || '某人';
                const text = data.text || '';
                const lang = data.lang || 'en';
                if (clientId) {
                    appendMessage(clientId, text, lang, from);
                }
                if (data.audio) {
                    playAudio(data.audio);
                }
            }
        }

        // ========== 修改 startAudioCapture：强制采样率 16000 ==========
        async function startAudioCapture() {
            try {
                // [修改] 创建 AudioContext 时指定采样率为 16000 Hz
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                sourceNode = audioContext.createMediaStreamSource(mediaStream);

                const processor = audioContext.createScriptProcessor(4096, 1, 1);
                processor.onaudioprocess = (e) => {
                    if (!isConnected) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcmData = floatTo16BitPCM(inputData);
                    const b64 = arrayBufferToBase64(pcmData);
                    sendMessage({ type: 'audio', audio: b64 });
                };

                sourceNode.connect(processor);
                processor.connect(audioContext.destination);
                isSpeaking = true;
                showToast('🎤 麦克风已启动');
            } catch (err) {
                console.error('麦克风启动失败:', err);
                showToast('⚠️ 无法访问麦克风');
            }
        }

        function stopAudioCapture() {
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            isSpeaking = false;
        }

        // ========== 修改 playAudio：使用 decodeAudioData 解码 WAV ==========
        function playAudio(b64Audio) {
            try {
                const binaryString = atob(b64Audio);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const arrayBuffer = bytes.buffer;

                // [修改] 如果 audioContext 不存在或已关闭，新建一个
                if (!audioContext || audioContext.state === 'closed') {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                // 使用 decodeAudioData 解码 WAV（硅基 TTS 返回的是 WAV）
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioContext.destination);
                    source.start();
                }, (err) => {
                    console.error('解码音频失败:', err);
                });
            } catch (e) {
                console.error('播放音频失败:', e);
            }
        }

        // --- 工具函数 ---
        function floatTo16BitPCM(float32Array) {
            const pcm = new Int16Array(float32Array.length);
            for (let i = 0; i < float32Array.length; i++) {
                const s = Math.max(-1, Math.min(1, float32Array[i]));
                pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return pcm.buffer;
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // --- 事件绑定 ---
        joinBtn.addEventListener('click', connect);

        leaveBtn.addEventListener('click', () => {
            if (ws) {
                ws.close();
            }
        });

        targetLangSelect.addEventListener('change', () => {
            if (isConnected) {
                sendMessage({ type: 'set_language', target_lang: targetLangSelect.value });
                showToast(`🔄 切换语言: ${targetLangSelect.options[targetLangSelect.selectedIndex].text}`);
            }
        });

        console.log('🎯 同声传译客户端已加载（硅基流动版）');
        console.log('📌 点击 "加入会议" 开始');
    </script>
</body>
</html>
